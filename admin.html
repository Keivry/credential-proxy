<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Credential Proxy · Observability</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --panel2: #1d2130;
    --border: #2a2f42;
    --text: #dbe1f0;
    --dim: #8a93ab;
    --accent: #4cc2ff;
    --ok: #34d399;
    --warn: #fbbf24;
    --err: #f87171;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.55 -apple-system, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    padding: 20px;
  }
  .wrap { max-width: 1200px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .sub { color: var(--dim); font-size: 12px; margin-bottom: 18px; }
  .banner {
    display: none; padding: 10px 14px; border-radius: 8px; margin-bottom: 14px;
    background: rgba(251, 191, 36, .12); border: 1px solid rgba(251, 191, 36, .4); color: var(--warn);
  }
  .banner.show { display: block; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .kpi {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px;
  }
  .kpi .label { color: var(--dim); font-size: 12px; margin-bottom: 6px; }
  .kpi .value { font-size: 24px; font-weight: 700; font-family: var(--mono); }
  .kpi .hint { color: var(--dim); font-size: 11px; margin-top: 4px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
  @media (max-width: 800px) { .grid2 { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 18px;
  }
  .panel h2 { font-size: 14px; margin-bottom: 10px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; position: relative; }
  .rt-tip {
    position: absolute; top: -34px; left: 50%; transform: translateX(-50%);
    background: #b3472e; color: #fff; padding: 6px 12px; border-radius: 6px;
    font-size: 11px; white-space: nowrap; box-shadow: 0 2px 10px rgba(0,0,0,.4);
    display: none; z-index: 140; pointer-events: none;
  }
  .rt-tip.show { display: block; }
  .rt-tip::after {
    content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
    border: 5px solid transparent; border-top-color: #b3472e;
  }
  .toolbar button, .toolbar select, .toolbar input {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer;
  }
  .toolbar button.active { background: var(--accent); color: #08121f; border-color: var(--accent); font-weight: 600; }
  .toolbar input[type=password] { min-width: 220px; cursor: text; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--dim); font-weight: 600; font-size: 11px; }
  td.num, th.num { text-align: right; font-family: var(--mono); }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover { background: var(--panel2); }
  .tooltip {
    position: fixed; z-index: 150; max-width: 420px; max-height: 60vh; overflow: auto;
    background: var(--panel2); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.45);
    pointer-events: auto;
  }
  .tooltip pre { white-space: pre-wrap; word-break: break-all; font-family: var(--mono); font-size: 11px; margin: 0; }
  .login {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: var(--bg); z-index: 200;
  }
  .login.show { display: flex; }
  .login-box { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 28px; width: 340px; }
  .login-box h2 { font-size: 16px; margin-bottom: 14px; }
  .login-box input {
    width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--panel2); color: var(--text); margin-bottom: 10px; font-size: 14px;
  }
  .login-box button {
    width: 100%; padding: 10px; border-radius: 6px; border: none; cursor: pointer;
    background: var(--accent); color: #08121f; font-weight: 700; font-size: 14px;
  }
  .login-err { color: var(--err); font-size: 12px; min-height: 18px; margin-bottom: 6px; }
  .live-ind { display: inline-flex; align-items: center; gap: 6px; color: var(--ok); font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; }
  .dot.off { background: var(--dim); }
  svg text { fill: var(--dim); font-size: 10px; }
  /* keyboard focus for PII rect (SVG) */
  svg rect[tabindex=\"0\"]:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
  .tokens4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-bottom: 10px; }
  .tok { background: var(--panel2); border-radius: 8px; padding: 8px 10px; }
  .tok .l { color: var(--dim); font-size: 11px; }
  .tok .v { font-family: var(--mono); font-size: 15px; font-weight: 600; }
</style>
</head>
<body>
<div class="login" id="login">
  <div class="login-box">
    <h2>管理员登录</h2>
    <div class="login-err" id="login-err"></div>
    <input type="password" id="pass" autocomplete="current-password" placeholder="OBSERVABILITY_ADMIN_TOKEN">
    <button id="login-btn">进入大盘</button>
  </div>
</div>

<div class="wrap" id="app" style="display:none">
  <h1>Credential Proxy · Observability</h1>
  <div class="sub">脱敏 / 上游 / Token / 审计 可观测性大盘 · <span id="live-txt" class="live-ind"><span class="dot" id="live-dot"></span> Live</span></div>
  <div class="banner" id="banner"></div>

  <div class="kpis" id="kpis"></div>

  <div class="panel">
    <h2>时序趋势</h2>
    <div class="toolbar" id="range-bar">
      <span class="rt-tip" id="rt-tip">请求过于频繁（限流 10/min），请稍候再试…</span>
      <button data-range="1h" class="active">1h</button>
      <button data-range="24h">24h</button>
      <button data-range="7d">7d</button>
      <button data-range="30d">30d</button>
      <select id="model-filter"><option value="">全部模型</option></select>
    </div>
    <div id="trend-chart"></div>
    <div id="trend-svg"></div>
  </div>

  <div class="tokens4" id="tokens4"></div>

  <div class="grid2">
    <div class="panel">
      <h2>PII 分布（按 kind）</h2>
      <div id="pii-chart"></div>
      <div id="pii-svg"></div>
    </div>
    <div class="panel">
      <h2>上游分布（按 port）</h2>
      <div id="upstream-chart"></div>
      <div id="upstream-svg"></div>
    </div>
  </div>

  <div class="panel">
    <h2>最近事件 <span style="color:var(--dim);font-weight:400">（悬停行查看脱敏摘要）</span></h2>
    <div class="toolbar">
      <select id="ev-upstream"><option value="">全部上游</option></select>
      <button id="ev-refresh">刷新</button>
      <button id="ev-live" class="active">Live</button>
    </div>
    <div style="overflow:auto">
      <table id="ev-table">
        <thead><tr>
          <th>ts</th><th>request_id</th><th>upstream</th><th>model</th><th>status</th>
          <th class="num">pii</th><th class="num">cred</th><th class="num">tokens</th>
          <th class="num">Cache%</th><th class="num">latency(ms)</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<div class="tooltip" id="ev-tooltip" hidden></div>

<script>
(function () {
  'use strict';
  var state = { range: '1h', token: '', live: true, ev: [], model: '', upstream: '',
    lastMetrics: null,
    // 累积全量集合（只增不减）：下拉选项永不随过滤收缩，保证任意维度可切换
    allModels: {}, allUpstreams:{} };

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }

  function fmtTs(ts) {
    if (!ts) return '';
    var d = new Date(ts * 1000);
    return d.toLocaleTimeString('zh-CN', { hour12: false });
  }

  function fmtNum(n) {
    if (n == null) return '—';
    n = Number(n);
    if (n < 1000) return String(n);
    var v, d;
    if (n >= 1e9) { v = n / 1e9; d = 'B'; }
    else if (n >= 1e6) { v = n / 1e6; d = 'M'; }
    else { v = n / 1e3; d = 'K'; }
    var s = v.toFixed(1).replace(/\.0$/, '');
    return s + d;
  }

  // 输入 token 缓存命中率：cached_read/input，input 缺省回退 prompt；分母 0/缺失 → '-'
  // 多模型时求和（sum input / sum cr），避免首模型遮蔽
  function fmtCache(e) {
    var toks = e.tokens || {};
    var cr = 0, input = 0;
    Object.keys(toks).forEach(function (m) {
      var t = toks[m];
      cr += t.cached_read || 0;
      var cur = t.input != null ? t.input : (t.prompt != null ? t.prompt : 0);
      input += cur;
    });
    if (!input) return null; // 0 → 显示 '-'
    return { pct: (cr / input * 100).toFixed(1) + '%', cr: cr, input: input };
  }

  function fmtPct(p) {
    if (p == null) return '—';
    return Number(p).toFixed(1) + '%';
  }

  function setBanner(msg, kind) {
    var b = document.getElementById('banner');
    if (!msg) { b.className = 'banner'; return; }
    b.className = 'banner show';
    b.textContent = msg;
  }

  function api(path, opts) {
    opts = opts || {};
    opts.headers = opts.headers || {};
    if (state.token && state.token !== '__cookie__') opts.headers['X-Admin-Token'] = state.token;
    opts.credentials = 'include';
    return fetch(path, opts).then(function (r) {
      if (r.status === 401) { throw new Error('unauthorized'); }
      if (r.status === 429) { throw new Error('ratelimited'); }
      if (!r.ok) { throw new Error('HTTP ' + r.status); }
      return r.json();
    });
  }

  // 限流提示：切换 range/筛选太频繁触发 10/min 限流时，在工具栏上方弹出 tooltip（3s 自动消失）
  function showRateLimit() {
    var tip = document.getElementById('rt-tip');
    if (!tip) return;
    tip.className = 'rt-tip show';
    clearTimeout(tip._t);
    tip._t = setTimeout(function () { tip.className = 'rt-tip'; }, 3000);
  }

  // ── 登录流程 ──
  function initAuth() {
    fetch('/_admin/health', { credentials: 'include' }).then(function (r) {
      if (r.status === 200) {
        state.token = '__cookie__';
        showApp();
        return null;
      }
      if (r.status === 429) {
        // 限流：Cookie 可能仍有效，但刷新太频繁。提示稍候而非弹登录框
        var el = document.getElementById('login-err');
        if (el) el.textContent = '请求过于频繁，请稍候再试…';
        showLogin();
        return null;
      }
      showLogin();
    }).catch(showLogin);
  }

  function showLogin() {
    document.getElementById('login').className = 'login show';
    document.getElementById('pass').focus();
  }

  function showApp() {
    document.getElementById('login').className = 'login';
    document.getElementById('app').style.display = 'block';
    loadAll();
    startLive();
  }

  function doLogin() {
    var t = document.getElementById('pass').value;
    if (!t) return;
    fetch('/_admin/health', {
      credentials: 'include',
      headers: { 'X-Admin-Token': t }
    }).then(function (r) {
      if (r.status === 200) {
        // 服务端已 Set-Cookie（HttpOnly）——后续请求与 SSE 全走 Cookie，
        // 内存不留明文 token，URL 不拼 ?access_token（防日志/历史泄漏）
        state.token = '__cookie__';
        history.replaceState({}, '', '/_admin/');
        showApp();
      } else {
        var el = document.getElementById('login-err');
        el.textContent = '401 未授权，请检查 Token';
        document.getElementById('login-box');
        var box = document.querySelector('.login-box');
        box.style.animation = 'none';
        void box.offsetWidth;
        box.style.animation = 'shake .3s';
      }
    }).catch(function () {
      document.getElementById('login-err').textContent = '请求失败，请重试';
    });
  }

  // ── KPI ──
  function renderKpis(metrics) {
    var el = document.getElementById('kpis');
    var req = metrics.requests || 0;
    var piiReqs = metrics.pii_requests || 0;
    // 脱敏占比 = 含 PII 请求数 / 总请求数（天然 ≤100%；pii_hits 是命中次数，可一次多中）
    var redactedRatio = req > 0 ? (piiReqs / req * 100) : 0;
    var piiHits = (metrics.pii_hits || 0) + (metrics.pii_miss || 0);
    var deny = (metrics.audit_by_verdict && metrics.audit_by_verdict.deny) || 0;
    var p95 = metrics.latency ? metrics.latency.p95 : null;
    var precise = metrics.latency ? metrics.latency.is_precise : false;
    var p95Txt = p95 == null ? '—' : (Math.round(p95) + ' ms');
    var p95Hint = state.range === '1h'
      ? (precise ? '1h 精确' : '1h≈（低流量或高 TPS 属预期）')
      : (state.range + '≈ 桶中位');
    var rangeLabel = state.range === '1h' ? '近 1 小时请求' :
      state.range === '24h' ? '近 24 小时请求' :
      state.range === '7d' ? '近 7 天请求' : '近 30 天请求';
    el.innerHTML =
      '<div class="kpi"><div class="label">' + rangeLabel + '</div><div class="value" title="' + esc(String(req)) + '">' + fmtNum(req) + '</div></div>' +
      '<div class="kpi"><div class="label">脱敏占比</div><div class="value" title="' + esc(piiReqs + ' / ' + req) + '">' + redactedRatio.toFixed(1) + '%</div><div class="hint">含 PII 请求 ' + fmtNum(piiReqs) + ' / 总 ' + fmtNum(req) + '</div></div>' +
      '<div class="kpi"><div class="label">PII Token 缓存</div><div class="value" title="' + esc(String(piiHits)) + '">' + fmtNum(piiHits) + '</div><div class="hint">hit(复用) ' + fmtNum(metrics.pii_hits || 0) + ' / miss(新值) ' + fmtNum(metrics.pii_miss || 0) + '</div></div>' +
      '<div class="kpi"><div class="label">阻断数</div><div class="value" title="' + esc(String(deny)) + '">' + fmtNum(deny) + '</div><div class="hint">deny verdict</div></div>' +
      '<div class="kpi"><div class="label">p95 延迟</div><div class="value">' + p95Txt + '</div><div class="hint">' + p95Hint + '</div></div>';
  }

  // ── Token 四卡 ──
  function renderTokens4(metrics) {
    var el = document.getElementById('tokens4');
    var toks = metrics.tokens || {};
    var prompt = 0, completion = 0, cachedRead = 0, cachedWrite = 0;
    Object.keys(toks).forEach(function (m) {
      var t = toks[m];
      prompt += t.prompt != null ? t.prompt : (t.input || 0);
      completion += t.completion != null ? t.completion : (t.output || 0);
      cachedRead += t.cached_read || 0;
      cachedWrite += t.cached_write || 0;
    });
    // usage 缺失告警：unknown 占比 >20%
    var totalReq = metrics.requests || 0;
    var unknown = 0;
    Object.keys(toks).forEach(function (m) { unknown += toks[m].unknown || 0; });
    if (totalReq > 0 && unknown / totalReq > 0.2) {
      setBanner('⚠️ 缓存命中/成本核算失真：' + Math.round(unknown / totalReq * 100) + '% 请求无 usage');
    } else {
      setBanner('');
    }
    el.innerHTML =
      '<div class="tok"><div class="l">输入 tokens</div><div class="v" title="' + esc(String(prompt)) + '">' + fmtNum(prompt) + '</div></div>' +
      '<div class="tok"><div class="l">输出 tokens</div><div class="v" title="' + esc(String(completion)) + '">' + fmtNum(completion) + '</div></div>' +
      '<div class="tok"><div class="l">缓存命中 cached_read</div><div class="v" title="' + esc(String(cachedRead)) + '">' + fmtNum(cachedRead) + '</div></div>' +
      '<div class="tok"><div class="l">缓存写入 cached_write</div><div class="v" title="' + esc(String(cachedWrite)) + '">' + fmtNum(cachedWrite) + '</div></div>';
  }

  // ── 图表（Chart.js 可用则用，否则 SVG 降级）──
  var chartInstances = {};

  function renderCharts(metrics) {
    state.lastMetrics = metrics;
    var piiData = metrics.pii_by_type || {};
    renderBar('pii', piiData, 'PII kind');
    // 上游分布稍后由 events 数据填充（renderUpstream 调用 renderBar('upstream', ...)）
  }

  function renderBar(id, data, label) {
    var keys = Object.keys(data || {});
    if (!keys.length) {
      document.getElementById(id + '-chart').innerHTML = '';
      document.getElementById(id + '-svg').innerHTML = '<span style="color:var(--dim)">暂无数据</span>';
      return;
    }
    var isPii = id === 'pii';
    var piiSamples = null, piiTruncated = null, piiPrecise = false;
    if (isPii) {
      var __m = state.lastMetrics || {};
      piiSamples = __m.pii_value_samples || {};
      piiTruncated = __m.pii_value_samples_truncated || {};
      piiPrecise = __m.pii_value_samples_is_precise === true;
    }
    function top3ForKind(kind) {
      if (!isPii || !piiPrecise) return [];
      var bucket = piiSamples ? piiSamples[kind] : null;
      if (!bucket || typeof bucket !== 'object') return [];
      var entries = Object.keys(bucket).map(function(mk) {
        var v = bucket[mk];
        var cnt = 0;
        if (v != null && typeof v === 'object') cnt = v.count != null ? Number(v.count) : Number(v);
        else cnt = Number(v);
        if (!isFinite(cnt)) cnt = 0;
        return [mk, cnt];
      });
      entries.sort(function(a,b){ return b[1]-a[1]; });
      return entries.slice(0, 3);
    }
    var hasChart = typeof Chart !== 'undefined';
    var svgEl = document.getElementById(id + '-svg');
    if (hasChart) {
      svgEl.innerHTML = '';
      try {
        var ctx = document.getElementById(id + '-chart');
        ctx.innerHTML = '<canvas id="' + id + '-canvas"></canvas>';
        var canvas = document.getElementById(id + '-canvas');
        var datasets = [{ label: label, data: keys.map(function (k) { return data[k]; }), backgroundColor: '#4cc2ff55', borderColor: '#4cc2ff', borderWidth: 1 }];
        var tooltipCbs = {
          label: function (c) { return ' ' + c.label + ': ' + Number(c.raw).toLocaleString('en-US'); }
        };
        if (isPii) {
          tooltipCbs.afterBody = function(items) {
            if (!items || !items.length) return [];
            var kind = items[0].label;
            var top3 = top3ForKind(kind);
            if (!top3.length) return [];
            // multi-line: first line header, rest one per masked to avoid long single line overflow on narrow viewport
            var out = ['Top 3:'];
            top3.forEach(function(p){
              var cnt = Number(p[1]);
              out.push(p[0] + ' x' + (isFinite(cnt) ? cnt.toLocaleString('en-US') : p[1]));
            });
            if (piiTruncated && piiTruncated[kind] === true) out.push('\u2026\u957f\u5c3e\u4ec5\u8ba1 pii_by_type');
            return out;
          };
        }
        // respects prefers-reduced-motion
        var prefersReduced = typeof window.matchMedia === 'function' && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!chartInstances[id]) {
          chartInstances[id] = new Chart(canvas, {
            type: 'bar',
            data: { labels: keys, datasets: datasets },
            options: {
              animation: prefersReduced ? false : undefined,
              plugins: {
                legend: { display: false },
                tooltip: { callbacks: tooltipCbs }
              },
              scales: {
                y: { beginAtZero: true, ticks: { callback: function (v) { return fmtNum(v); } } },
                x: { ticks: { maxRotation: 45, minRotation: 0, autoSkip: true, maxTicksLimit: 20 } }
              }
            }
          });
        } else {
          var ch = chartInstances[id];
          ch.data.labels = keys;
          ch.data.datasets = datasets;
          if (isPii) ch.options.plugins.tooltip.callbacks = tooltipCbs;
          else ch.options.plugins.tooltip.callbacks.label = tooltipCbs.label;
          ch.update();
        }
        if (isPii && !piiPrecise) {
          var hintId = 'pii-precise-hint';
          var old = document.getElementById(hintId);
          if (old) old.remove();
          var hint = document.createElement('div');
          hint.id = hintId;
          hint.textContent = 'PII \u91c7\u6837\u672a\u542f\u7528\u6216\u6570\u636e\u4e0d\u7cbe\u786e\uff0c\u4ec51h\u7cbe\u786e\uff0c24h/7d\u9700\u5f00\u542f\u6301\u4e45\u5316\uff08PII_VALUE_SAMPLE_PERSIST=1\uff09';
          hint.setAttribute('style', 'color:var(--dim);font-size:11px;margin-top:6px');
          hint.setAttribute('role', 'status');
          hint.setAttribute('aria-live', 'polite');
          svgEl.parentElement.appendChild(hint);
        } else if (isPii) {
          var old2 = document.getElementById('pii-precise-hint');
          if (old2) old2.remove();
        }
        return;
      } catch (e) {
      }
    }
    if (isPii) {
      var oldHint = document.getElementById('pii-precise-hint');
      if (oldHint) oldHint.remove();
      svgEl.textContent = '';
      document.getElementById(id + '-chart').textContent = '';
      var NS = 'http://www.w3.org/2000/svg';
      var max = Math.max.apply(null, keys.map(function (k) { return data[k]; }));
      var w = 480, h = 160, bw = 40;

      svg.setAttribute('style', 'max-width:100%;overflow-x:auto');
      keys.forEach(function(k, i) {
        var cnt = data[k];
        var bh = Math.max(2, (cnt / max) * (h - 36));
        var valY = h - bh - 26;
        if (valY < 8) valY = Math.min(h - bh + 12, h - 8);
        var g = document.createElementNS(NS, 'g');

          if (piiTruncated && piiTruncated[k] === true) t += '\n\u2026\u957f\u5c3e\u4ec5\u8ba1 pii_by_type';

        rTitle.textContent = t;

        var tVal = document.createElementNS(NS, 'text');

        tVal.setAttribute('text-anchor', 'middle');
        tVal.textContent = fmtNum(cnt);
        var tLab = document.createElementNS(NS, 'text');
        tLab.setAttribute('x', String(i * (bw + 8) + 8 + bw / 2));
        tLab.setAttribute('y', String(h - 6));
        tLab.setAttribute('text-anchor', 'middle');

        g.appendChild(rect);
        g.appendChild(tVal);

        svg.appendChild(g);
      });

      if (!piiPrecise) {

        h2.textContent = 'PII \u91c7\u6837\u672a\u542f\u7528\u6216\u6570\u636e\u4e0d\u7cbe\u786e\uff0c\u4ec51h\u7cbe\u786e\uff0c24h/7d\u9700\u5f00\u542f\u6301\u4e45\u5316\uff08PII_VALUE_SAMPLE_PERSIST=1\uff09';
        h2.setAttribute('style', 'color:var(--dim);font-size:11px;margin-top:6px');
        h2.setAttribute('role', 'status');
        h2.setAttribute('aria-live', 'polite');
        svgEl.parentElement.appendChild(h2);
      }
      return;
    }
    var max2 = Math.max.apply(null, keys.map(function (k) { return data[k]; }));
    var w2 = 480, h2 = 160, bw2 = 40;
    // 非PII降级亦用 DOM+textContent 统一范式（与PII分支一致，消 esc 遗漏风险）
    var NS2 = 'http://www.w3.org/2000/svg';
    var svg2 = document.createElementNS(NS2, 'svg');
    svg2.setAttribute('width', String(Math.min(1200, Math.max(w2, keys.length * (bw2 + 8)))));
  svg2.setAttribute('style', 'max-width:100%;overflow-x:auto');
    svg2.setAttribute('height', String(h2));
    keys.forEach(function(k, i) {
      var cnt = data[k];
      var bh = Math.max(2, (cnt / max2) * (h2 - 36));
      var valY = h2 - bh - 26;
      if (valY < 8) valY = Math.min(h2 - bh + 12, h2 - 8);
      var g2 = document.createElementNS(NS2, 'g');

      rect2.setAttribute('x', String(i * (bw2 + 8) + 8));

      rect2.setAttribute('height', String(bh));

      tLab2.setAttribute('x', String(i * (bw2 + 8) + 8 + bw2 / 2));
      tLab2.setAttribute('y', String(h2 - 6));
      tLab2.setAttribute('text-anchor', 'middle');
      var labShort2 = String(k).slice(0, 10);
      tLab2.textContent = labShort2;

  function renderTrend(seriesData) {
    // 多序列折线：seriesData = {buckets: [{ts, requests, tokens_prompt, tokens_completion, cached_read, p95, pii_requests}], is_precise}
    var buckets = (seriesData && seriesData.buckets) || [];
    var hasChart = typeof Chart !== 'undefined';
    var svgEl = document.getElementById('trend-svg');
    var chartEl = document.getElementById('trend-chart');
    var labels = buckets.map(function (b) {
      var d = new Date(b.ts * 1000);
      return state.range === '1h' ? d.toLocaleTimeString('zh-CN', { hour12: false, minute: '2-digit' })
        : state.range === '24h' ? d.toLocaleTimeString('zh-CN', { hour12: false, hour: '2-digit' })
        : d.toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit' });
    });
    var mkSeries = function (key, label, color) {
      return { label: label, data: buckets.map(function (b) { return b[key] || 0; }),
        borderColor: color, backgroundColor: color + '22', fill: false, tension: 0.3, spanGaps: false };
    };
    if (hasChart) {
      svgEl.innerHTML = '';
      chartEl.innerHTML = '<canvas id="trend-canvas"></canvas>';
      try {
        var canvas = document.getElementById('trend-canvas');
        var datasets = [
          mkSeries('requests', 'requests', '#4cc2ff'),
          mkSeries('tokens_prompt', 'tokens_prompt', '#34d399'),
          mkSeries('tokens_completion', 'tokens_completion', '#fbbf24'),
          mkSeries('p95', 'p95(ms)', '#f87171'),
          mkSeries('pii_requests', 'pii_requests', '#c084fc')
        ];
        if (!chartInstances['trend']) {
          chartInstances['trend'] = new Chart(canvas, {
            type: 'line',
            data: { labels: labels, datasets: datasets },
            options: {
              // 宽松 hover：nearest 就近任意点触发（index 模式要求落在索引区间内，判定过严）
              interaction: { mode: 'nearest', intersect: false, axis: 'x' },
              plugins: {
                legend: { labels: { color: '#8a93ab', font: { size: 10 } } },
                tooltip: {
                  callbacks: {
                    label: function (ctx) {
                      var v = ctx.raw;
                      return ' ' + ctx.dataset.label + ': ' + (typeof v === 'number' ? Number(v).toLocaleString('en-US') : v);
                    }
                  }
                }
              },
              scales: {
                y: {
                  title: { display: true, text: '数量 / ms', color: '#8a93ab', font: { size: 10 } },
                  ticks: { callback: function (val) { return fmtNum(val); }, color: '#8a93ab' }, grid: { color: '#2a2f42' }
                },
                x: {
                  title: { display: true, text: state.range === '1h' ? '分钟' : (state.range === '24h' ? '小时' : '日期'), color: '#8a93ab', font: { size: 10 }, padding: { top: 8 } },
                  ticks: { color: '#8a93ab', maxTicksLimit: state.range === '1h' ? 12 : 10, maxRotation: 0, minRotation: 0, autoSkip: true, padding: 6 },
                  grid: { display: false }
                }
              }
            }
          });
        } else {
          var ch = chartInstances['trend'];
          ch.data.labels = labels;
          ch.data.datasets = datasets;
          ch.update();
        }
        var precEl = document.getElementById('trend-precise');
        if (precEl) precEl.textContent = seriesData && seriesData.is_precise ? '' : '≈';
        return;
      } catch (e) { /* fallthrough */ }
    }
    chartEl.innerHTML = '';
    // SVG 折线降级（带横纵轴标尺 + <title> 精确值 hover）
    if (buckets.length) {
      // 响应式宽度：svgEl 是普通 div，clientWidth = 布局内容区宽（不含 padding）。
      // 用 parentElement.clientWidth 会包含 panel 的 padding（16px*2）导致 SVG 超宽溢出。
      var contW = svgEl.clientWidth || svgEl.parentElement.clientWidth || 0;
      var W = Math.max(480, contW - 4), H = 160, pad = 8, gap = 26;
      // 布局：数据区两侧各留 gap（给 y 轴标尺 + x 轴首尾标签空间），当前时间（最后一个桶）固定在数据区 3/4 处，右侧 1/4 留白给未来（无数据不画）
      var x0 = pad + gap;
      var plotW = (W - 2 * pad - 2 * gap) * 0.75;
      var maxV = Math.max.apply(null, buckets.map(function (b) { return b.requests || 0; })) || 1;
      var step = plotW / (buckets.length - 1 || 1);
      var pts = buckets.map(function (b, i) {
        var x = x0 + i * step, y = H - pad - ((b.requests || 0) / maxV) * (H - 2 * pad);
        return x.toFixed(1) + ',' + y.toFixed(1);
      }).join(' ');
      // hover 采样点：7d=168 小时桶太密，抽稀到 ~24 个（polyline 保留全点保持折线形状，
      // 但视觉点/hover 热区只画采样点，密度与 24h/30d 一致）；1h/24h/30d 全量画点
      var maxPts = state.range === '7d' ? 24 : buckets.length;
      var ptIdxs = [];
      if (buckets.length <= maxPts) { for (var pi = 0; pi < buckets.length; pi++) ptIdxs.push(pi); }
      else {
        for (var pk = 0; pk < maxPts; pk++) ptIdxs.push(Math.round(pk * (buckets.length - 1) / (maxPts - 1)));
      }
      // hover 热区：透明大圆（r=8 好命中）+ 视觉小点（r=2），两层叠加；<title> 精确值
      var circles = ptIdxs.map(function (i) {
        var b = buckets[i];
        var x = x0 + i * step, y = H - pad - ((b.requests || 0) / maxV) * (H - 2 * pad);
        return '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="8" fill="transparent" style="cursor:pointer">' +
          '<title>' + esc(labels[i]) + ' requests=' + (b.requests || 0).toLocaleString('en-US') +
          ' tokens_prompt=' + (b.tokens_prompt || 0).toLocaleString('en-US') +
          ' p95=' + (b.p95 != null ? Math.round(b.p95) : '—') + '</title></circle>' +
          '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="2" fill="#4cc2ff" pointer-events="none"/>';
      }).join('');
      // Y 轴：竖线在数据区左侧（axisX），刻度横线从轴向左延伸小 tick + 贯穿到数据区右边界；
      // 标尺文字在轴左边（anchor=end），X 轴底线 + 数据区/未来区标签
      var plotRight = x0 + plotW; // 数据区右边界 = 当前时间位置
      var axisX = x0 - 6; // y 轴竖线位置（数据区左侧 6px）
      var yTicks = '';
      for (var t = 0; t <= 4; t++) {
        var yy = H - pad - (t / 4) * (H - 2 * pad);
        yTicks += '<line x1="' + (axisX - 6) + '" y1="' + yy.toFixed(1) + '" x2="' + plotRight.toFixed(1) + '" y2="' + yy.toFixed(1) + '" stroke="#2a2f42" stroke-width="0.5"/>' +
          '<text x="' + (axisX - 8) + '" y="' + (yy + 3).toFixed(1) + '" fill="#8a93ab" font-size="8" text-anchor="end">' + fmtNum(maxV * t / 4) + '</text>';
      }
      // x 轴标签：1h 取 12 个、24h 取 12 个、7d/30d 取 10 个均匀分布时间点，放轴下方（不重叠）。
      // 数据区与未来区共用同一刻度节奏（labelEvery 桶 1 个），间距一致；
      // 最左标签 anchor=start（避免左溢出被裁），最右（未来区最后一个）anchor=end
      var xLabels = '';
      var n = labels.length;
      var maxXL = state.range === '1h' ? 12 : (state.range === '24h' ? 12 : 10);
      var idxs = [];
      if (n <= maxXL) { for (var i = 0; i < n; i++) idxs.push(i); }
      else {
        for (var k = 0; k < maxXL; k++) idxs.push(Math.round(k * (n - 1) / (maxXL - 1)));
      }
      // 数据区标签的均匀间隔（桶数），未来区沿用同一节奏
      var labelEvery = (n > 1) ? (n - 1) / Math.max(1, maxXL - 1) : 1;
      idxs.forEach(function (i) {
        var xx = x0 + i * step;
        var anchor = (i === idxs[0]) ? 'start' : 'middle';
        xLabels += '<text x="' + xx.toFixed(1) + '" y="' + (H - pad + 16) + '" fill="#8a93ab" font-size="8" text-anchor="' + anchor + '">' + esc(labels[i]) + '</text>';
      });
      // 未来区（3/4 右侧 1/4）：延续数据区同一刻度节奏（labelEvery 桶 1 个），
      // 画未来标签（弱化色，opacity 0.7），不画折线（无数据）
      var lastBucketTs = buckets[buckets.length - 1].ts;
      var bucketSpan = (buckets.length > 1) ? (buckets[buckets.length - 1].ts - buckets[buckets.length - 2].ts) : 60;
      var futureIdx = 1;
      while (true) {
        var fx = plotRight + futureIdx * step * labelEvery;
        if (fx > W - pad) break;
        var fts = lastBucketTs + futureIdx * bucketSpan * labelEvery;
        var fl = new Date(fts * 1000);
        var fLabel = state.range === '1h' ? fl.toLocaleTimeString('zh-CN', { hour12: false, minute: '2-digit' })
          : state.range === '24h' ? fl.toLocaleTimeString('zh-CN', { hour12: false, hour: '2-digit' })
          : fl.toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit' });
        xLabels += '<text x="' + fx.toFixed(1) + '" y="' + (H - pad + 16) + '" fill="#5a6275" font-size="8" text-anchor="end" opacity="0.7">' + esc(fLabel) + '</text>';
        futureIdx++;
      }
      svgEl.innerHTML = '<svg width="' + W + '" height="' + (H + 28) + '" viewBox="0 0 ' + W + ' ' + (H + 28) + '">' +
        // y 轴竖线（数据区左侧）
        '<line x1="' + axisX + '" y1="' + pad + '" x2="' + axisX + '" y2="' + (H - pad) + '" stroke="#3a3f55" stroke-width="1"/>' +
        // x 轴底线延伸全宽（未来区也有横轴）；数据区到 3/4 实线，未来区虚线
        '<line x1="' + x0 + '" y1="' + (H - pad) + '" x2="' + plotRight.toFixed(1) + '" y2="' + (H - pad) + '" stroke="#3a3f55" stroke-width="1"/>' +
        '<line x1="' + plotRight.toFixed(1) + '" y1="' + (H - pad) + '" x2="' + (W - pad) + '" y2="' + (H - pad) + '" stroke="#3a3f55" stroke-width="1" stroke-dasharray="3 3"/>' +
        // 右侧 1/4 未来区：虚线标记"现在"分界（当前时间竖线），提示未来无数据
        '<line x1="' + plotRight.toFixed(1) + '" y1="' + pad + '" x2="' + plotRight.toFixed(1) + '" y2="' + (H - pad) + '" stroke="#3a3f55" stroke-width="1" stroke-dasharray="3 3"/>' +
        yTicks +
        '<polyline points="' + pts + '" fill="none" stroke="#4cc2ff" stroke-width="1.5"/>' + circles +
        xLabels +
        '</svg>';
    } else {
      svgEl.innerHTML = '<span style="color:var(--dim)">' + esc(state.range) + ' 窗口无数据</span>';
    }
  }

  function renderUpstream(metrics, events) {
    var byUp = {};
    (events ||[]).forEach(function (e) {
      var u = e.upstream || 'other';
      byUp[u] = (byUp[u] || 0) + 1;
    });
    // 无事件时用 metrics 近似
    if (!Object.keys(byUp).length) {
      var rbs = metrics.requests_by_status || {};
      byUp['other'] = Object.keys(rbs).reduce(function (a, k) { return a + (rbs[k] || 0); }, 0);
    }
    renderBar('upstream', byUp, 'upstream port');
  }

  // ── 事件表 ──
  function renderEvents(events) {
    // 列表重建前先隐藏 tooltip，避免重建瞬间旧 tooltip 残留 + 新行索引错位
    hideEvTooltip();
    clearTimeout(hoverTimer);
    // 按 request_id 去重（SSE 增量与全量加载竞态时可能重复），保留最新顺序
    var seen = {};
    state.ev = (events ||[]).filter(function (e) {
      var rid = e.request_id || '';
      if (rid && seen[rid]) return false;
      if (rid) seen[rid] = 1;
      return true;
    });
    var tbody = document.querySelector('#ev-table tbody');
    tbody.innerHTML = (state.ev ||[]).map(function (e, idx) {
      var tokens = e.tokens || {};
      var tokTotal = 0;
      Object.keys(tokens).forEach(function (m) {
        var t = tokens[m];
        tokTotal += (t.prompt != null ? t.prompt : (t.input || 0)) + (t.completion != null ? t.completion : (t.output || 0));
      });
      var cache = fmtCache(e);
      var cacheTd = cache
        ? '<td class="num" title="' + esc(cache.cr + ' / ' + cache.input) + '">' + esc(cache.pct) + '</td>'
        : '<td class="num" title="无 usage">—</td>';
      var latTd = e.latency_ms != null ? Math.round(e.latency_ms) : '—';
      return '<tr class="clickable" data-i="' + idx + '">' +
        '<td>' + esc(fmtTs(e.ts)) + '</td>' +
        '<td>' + esc(e.request_id || '') + '</td>' +
        '<td>' + esc(e.upstream || '') + '</td>' +
        '<td>' + esc(e.model || '') + '</td>' +
        '<td>' + esc(e.status || '') + '</td>' +
        '<td class="num" title="' + esc(String(e.pii_hits)) + '">' + fmtNum(e.pii_hits) + '</td>' +
        '<td class="num" title="' + esc(String(e.cred_hits)) + '">' + fmtNum(e.cred_hits) + '</td>' +
        '<td class="num" title="' + esc(String(tokTotal)) + '">' + fmtNum(tokTotal) + '</td>' +
        cacheTd +
        '<td class="num">' + latTd + '</td>' +
        '</tr>';
    }).join('') || '<tr><td colspan="10" style="color:var(--dim)">暂无事件</td></tr>';
    // 行 hover → tooltip 浮窗（mouseenter 显示、mouseleave 关闭、Esc/点击外部关闭）
    bindRowHover(tbody);
  }

  // 事件行 hover tooltip：行旁固定浮窗，200ms 延迟显示；移入浮窗不关闭；Esc/点击外部/滚动关闭
  var hoverTimer = null, hoverRow = null;
  function bindRowHover(tbody) {
    var rows = tbody.querySelectorAll('tr.clickable');
    Array.prototype.forEach.call(rows, function (tr) {
      var idx = Number(tr.getAttribute('data-i'));
      var e = state.ev[idx];
      if (!e) return;
      // 闭包直接捕获事件对象 e（而非索引）——列表刷新重建 DOM 后，
      // 旧闭包/旧行引用失效，用索引会读到 state.ev 里“后移一位”的别的行事件 → tooltip 错位
      tr.addEventListener('mouseenter', function (evt) {
        clearTimeout(hoverTimer);
        hoverRow = tr;
        hoverTimer = setTimeout(function () { showEvTooltip(e, tr, evt); }, 200);
      });
      tr.addEventListener('mouseleave', function () {
        clearTimeout(hoverTimer);
        setTimeout(function () {
          var tip = document.getElementById('ev-tooltip');
          if (tip && !tip.matches(':hover')) hideEvTooltip();
        }, 150);
      });
      tr.addEventListener('click', function (evt) {
        if (e) showEvTooltip(e, tr, evt); // 点击固定
      });
    });
  }

  function showEvTooltip(e, tr, evt) {
    var tip = document.getElementById('ev-tooltip');
    // 脱敏摘要 + 关键字段（原样保留 __PII_*__/__VG_CRED_*__ 占位符，不还原）
    var toks = e.tokens || {};
    var tokLines = Object.keys(toks).map(function (m) {
      var t = toks[m];
      return m + ': prompt=' + (t.prompt != null ? t.prompt : (t.input || 0)) + ' completion=' + (t.completion != null ? t.completion : (t.output || 0)) +
        ' cached_read=' + (t.cached_read || 0);
    }).join('\n') || '(无 usage)';
    var summary = e.summary || e.raw_summary || '';
    tip.textContent = '';
    var pre = document.createElement('pre');
    pre.textContent =
      'request_id: ' + (e.request_id || '') + '\n' +
      'ts: ' + fmtTs(e.ts) + ' | upstream: ' + (e.upstream || '') + ' | model: ' + (e.model || '') + '\n' +
      'status: ' + (e.status || '') + ' | latency: ' + (e.latency_ms != null ? Math.round(e.latency_ms) + 'ms' : '—') + '\n' +
      'pii_hits: ' + (e.pii_hits || 0) + ' | cred_hits: ' + (e.cred_hits || 0) + '\n' +
      'tokens:\n' + tokLines + '\n' +
      'summary: ' + summary;
    tip.appendChild(pre);
    tip.hidden = false;
    // 定位跟随鼠标（fixed，防溢出视口：右侧放不下换左侧；底部放不下上移，保证完整可见）
    var rect = tr.getBoundingClientRect();
    var cx = (evt && typeof evt.clientX === 'number') ? evt.clientX : (rect.left + rect.width / 2);
    var cy = (evt && typeof evt.clientY === 'number') ? evt.clientY : rect.top;
    var left = cx + 16; // 鼠标右侧 16px，避免遮住鼠标下的内容
    if (left + 420 > window.innerWidth) left = cx - 428; // 右侧放不下 → 鼠标左侧
    tip.style.left = Math.max(4, left) + 'px';
    // 先显示再测量实际高度（max-height 60vh 可能更矮）
    var th = tip.offsetHeight;
    var top = cy - th - 12; // 默认在鼠标上方（不挡行内容）
    if (top < 4) top = cy + 18; // 上方放不下 → 鼠标下方
    if (top + th > window.innerHeight - 4) top = Math.max(4, window.innerHeight - th - 8);
    tip.style.top = top + 'px';
  }

  function hideEvTooltip() {
    var tip = document.getElementById('ev-tooltip');
    if (tip) tip.hidden = true;
  }

  // ── 数据加载 ──
  // 请求序号：快速切换 range 时丢弃过期响应，防慢查询（SQLite）覆盖新查询（内存）
  var loadSeq = 0;
  function loadAll() {
    var seq = ++loadSeq;
    var q = '?range=' + state.range;
    if (state.model) q += '&model=' + encodeURIComponent(state.model);
    if (state.upstream) q += '&upstream=' + encodeURIComponent(state.upstream);
    var eq = '/_admin/events?limit=100' + (state.model ? '&model=' + encodeURIComponent(state.model) : '') + (state.upstream ? '&upstream=' + encodeURIComponent(state.upstream) : '');
    // 并行拉取（metrics/series/events 互不依赖），减少串行延迟与限流压力
    Promise.all([
      api('/_admin/metrics' + q),
      api('/_admin/series' + q),
      api(eq)
    ]).then(function (res) {
      if (seq !== loadSeq) return;
      var m = res[0], s = res[1], d = res[2];
      renderKpis(m);
      renderTokens4(m);
      renderCharts(m);
      renderTrend(s);
      var evs = d.events || [];
      renderEvents(evs);
      renderUpstream(m, evs);
      fillUpstreamFilter(evs);
      fillModelFilter(m, evs);
    }).catch(function (err) {
      if (seq !== loadSeq) return;
      if (err.message === 'unauthorized') {
        state.token = '';
        showLogin();
      } else if (err.message === 'ratelimited') {
        showRateLimit();
      }
    });
  }

  function fillModelFilter(metrics, evs) {
    var sel = document.getElementById('model-filter');
    var cur = sel.value;
    var models = state.allModels;
    // 累积全量（只增不减）：tokens 键 + 事件行 model 并入集合，过滤后仍保留全部选项
    Object.keys((metrics && metrics.tokens) ||{}).forEach(function (m) { models[m] = 1; });
    (evs ||[]).forEach(function (e) { if (e.model) models[e.model] = 1; });
    var html = '<option value="">全部模型</option>';
    Object.keys(models).sort().forEach(function (m) {
      var label = m === 'unknown_model' ? '未知模型 (unknown)' : m;
      html += '<option value="' + esc(m) + '">' + esc(label) + '</option>';
    });
    sel.innerHTML = html;
    sel.value = cur;
    sel.disabled = !Object.keys(models).length;
  }

  function fillUpstreamFilter(evs) {
    var sel = document.getElementById('ev-upstream');
    var cur = sel.value;
    var ups = state.allUpstreams;
    // 累积全量（只增不减）：过滤后仍保留全部上游选项
    (evs ||[]).forEach(function (e) { ups[e.upstream || 'other'] = 1; });
    var html = '<option value="">全部上游</option>';
    Object.keys(ups).sort().forEach(function (u) { html += '<option value="' + esc(u) + '">' + esc(u) + '</option>'; });
    sel.innerHTML = html;
    sel.value = cur;
  }

  // ── Live SSE ──
  var sseEs = null, fallbackTimer = null;
  function startLive() {
    var es;
    function connect() {
      if (!state.live) return;
      var url = '/_admin/events/stream?range=' + state.range;
      if (state.model) url += '&model=' + encodeURIComponent(state.model);
      if (state.upstream) url += '&upstream=' + encodeURIComponent(state.upstream);
      if (state.token && state.token !== '__cookie__') url += '&access_token=' + encodeURIComponent(state.token);
      es = new EventSource(url);
      sseEs = es;
      es.onopen = function () {
        document.getElementById('live-dot').className = 'dot';
        if (fallbackTimer) { clearInterval(fallbackTimer); fallbackTimer = null; }
      };
      es.onerror = function () {
        document.getElementById('live-dot').className = 'dot off';
        es.close();
        // 断开回退：15s 轮询全量刷新（SSE 恢复时清除，防 PII 柱陈旧）
        if (!fallbackTimer) {
          fallbackTimer = setInterval(function () {
            var q = '?range=' + state.range;
            if (state.model) q += '&model=' + encodeURIComponent(state.model);
            if (state.upstream) q += '&upstream=' + encodeURIComponent(state.upstream);
            api('/_admin/metrics' + q).then(function(m){
              renderKpis(m); renderTokens4(m); renderCharts(m);
            }).catch(function () {});
          }, 15000);
        }
        setTimeout(connect, 3000);
      };
      es.addEventListener('event', function (ev) {
        try {
          var e = JSON.parse(ev.data);
          prependEvent(e);
        } catch (err) { /* ignore */ }
      });
      es.addEventListener('metrics', function (ev) {
        try {
          var snap = JSON.parse(ev.data);
          // range 绑定校验：SSE 快照回显 range，与当前 state 不一致则丢弃（防旧窗口覆盖）
          if (snap.range !== state.range) return;
          if ((snap.model || null) !== (state.model || null)) return;
          if ((snap.upstream || null) !== (state.upstream || null)) return;
          var m = snap.metrics || {};
          if (m && m.error) return;
          renderKpis(m);
          renderTokens4(m);
          renderCharts(m);
          if (snap.series && !snap.series.error) renderTrend(snap.series);
        } catch (err) { /* ignore */ }
      });
      es.addEventListener('done', function () {
        es.close();
        setTimeout(connect, 1000);
      });
    }
    connect();
  }

  // 切 range/model/upstream 时重建 SSE（绑定新维度，防旧快照覆盖）
  function restartLive() {
    if (!state.live) return;
    if (sseEs) { sseEs.close(); sseEs = null; }
    if (fallbackTimer) { clearInterval(fallbackTimer); fallbackTimer = null; }
    startLive();
  }

  function prependEvent(e) {
    var evs = state.ev || [];
    // 新事件并入累积集合（下拉选项跟随真实数据，SSE 增量也生效）
    if (e.model) state.allModels[e.model] = 1;
    if (e.upstream) state.allUpstreams[e.upstream] = 1;
    // 按 request_id 去重：SSE 重连历史快照重推 / 快照与轮询竞态时跳过已存在事件，防重复行
    var rid = e.request_id || '';
    if (rid) {
      for (var i = 0; i < evs.length; i++) {
        if (evs[i].request_id === rid) return; // 已存在，跳过
      }
    }
    evs.unshift(e);
    evs = evs.slice(0, 100);
    state.ev = evs;
    var tbody = document.querySelector('#ev-table tbody');
    var first = tbody.querySelector('tr:first-child');
    var row = document.createElement('tr');
    var tokens = e.tokens || {};
    var tokTotal = 0;
    Object.keys(tokens).forEach(function (m) {
      var t = tokens[m];
      tokTotal += (t.prompt != null ? t.prompt : (t.input || 0)) + (t.completion != null ? t.completion : (t.output || 0));
    });
    var cache = fmtCache(e);
    var cacheTd = cache
      ? '<td class="num" title="' + esc(cache.cr + ' / ' + cache.input) + '">' + esc(cache.pct) + '</td>'
      : '<td class="num" title="无 usage">—</td>';
    row.className = 'clickable';
    row.setAttribute('data-i', '0');
    row.innerHTML =
      '<td>' + esc(fmtTs(e.ts)) + '</td>' +
      '<td>' + esc(e.request_id || '') + '</td>' +
      '<td>' + esc(e.upstream || '') + '</td>' +
      '<td>' + esc(e.model || '') + '</td>' +
      '<td>' + esc(e.status || '') + '</td>' +
      '<td class="num" title="' + esc(String(e.pii_hits)) + '">' + fmtNum(e.pii_hits) + '</td>' +
      '<td class="num" title="' + esc(String(e.cred_hits)) + '">' + fmtNum(e.cred_hits) + '</td>' +
      '<td class="num" title="' + esc(String(tokTotal)) + '">' + fmtNum(tokTotal) + '</td>' +
      cacheTd +
      '<td class="num">' + (e.latency_ms != null ? Math.round(e.latency_ms) : '—') + '</td>';
    // hover tooltip（复用 renderEvents 的 bindRowHover——但单行插入后手动绑定）
    row.addEventListener('mouseenter', function (evt) {
      clearTimeout(hoverTimer);
      hoverRow = row;
      hoverTimer = setTimeout(function () { showEvTooltip(e, row, evt); }, 200);
    });
    row.addEventListener('mouseleave', function () {
      clearTimeout(hoverTimer);
      setTimeout(function () {
        var tip = document.getElementById('ev-tooltip');
        if (tip && !tip.matches(':hover')) hideEvTooltip();
      }, 150);
    });
    row.addEventListener('click', function (evt) { showEvTooltip(e, row, evt); });
    if (first) tbody.insertBefore(row, first);
    else tbody.appendChild(row);
  }

  // ── 事件绑定 ──
  document.addEventListener('DOMContentLoaded', function () {
    initAuth();
    document.getElementById('login-btn').addEventListener('click', doLogin);
    document.getElementById('pass').addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') doLogin();
    });
    document.querySelectorAll('#range-bar button').forEach(function (b) {
      b.addEventListener('click', function () {
        document.querySelectorAll('#range-bar button').forEach(function (x) { x.className = ''; });
        b.className = 'active';
        state.range = b.getAttribute('data-range');
        loadAll();
        restartLive();
      });
    });
    document.getElementById('ev-refresh').addEventListener('click', loadAll);
    document.getElementById('ev-live').addEventListener('click', function () {
      state.live = !state.live;
      this.className = state.live ? 'active' : '';
      if (state.live) startLive();
    });
    document.getElementById('ev-upstream').addEventListener('change', function () {
      state.upstream = this.value;
      loadAll();
      restartLive();
    });
    document.getElementById('model-filter').addEventListener('change', function () {
      state.model = this.value;
      loadAll();
      restartLive();
    });
    // Esc 关闭 tooltip；点击外部关闭；滚动关闭
    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') hideEvTooltip();
    });
    document.addEventListener('click', function (ev) {
      var tip = document.getElementById('ev-tooltip');
      if (tip && !tip.hidden && !ev.target.closest('#ev-tooltip') && !ev.target.closest('tr.clickable')) {
        hideEvTooltip();
      }
    });
    window.addEventListener('scroll', function () { hideEvTooltip(); }, true);
  });
})();
</script>
