services:
  credential-proxy:
    build: .
    image: ghcr.io/keivry/credential-proxy:0.9.30
    container_name: credential-proxy
    restart: unless-stopped
    cap_add:
      - IPC_LOCK  # mlockall 所需
    ulimits:
      memlock:
        soft: -1
        hard: -1   # 防止 mlockall(ENOMEM)
    environment:
      # ── Matrix 审批（必填）──
      - HOMESERVER=https://matrix.example.com
      - ROOM_ID=!yourroomid:matrix.example.com
      - MATRIX_ACCESS_TOKEN=${MATRIX_ACCESS_TOKEN:?MATRIX_ACCESS_TOKEN is required}

      # ── Observability 大盘（/_admin，必填）──
      # OBSERVABILITY_ADMIN_TOKEN: /_admin 大盘鉴权 Token，≥32 字符，须与其它 Token 独立。
      #   未设置 → 拒绝启动（SystemExit）；OBSERVABILITY_DISABLE=1 可显式禁用 /_admin。
      - OBSERVABILITY_ADMIN_TOKEN=${OBSERVABILITY_ADMIN_TOKEN:?OBSERVABILITY_ADMIN_TOKEN is required}
      # - OBSERVABILITY_DISABLE=1   # 过渡逃生开关（禁用 /_admin，不推荐生产）

      # ── 三因子认证（v0.8.0+，强烈建议开启）──
      # 开启后仅 get 二进制可通过认证直接通信，curl/Python 直调被 403 拒绝。
      # GET_BINARY_HASH: get 二进制的 SHA256 哈希值
      #   sha256sum $(which get) | cut -d' ' -f1
      # GET_BINARY_SECRET: 部署密钥（Hermes 容器与 Proxy 容器共享）
      #   openssl rand -hex 32
      # 两个都必须设置才生效；都为空时跳过认证（兼容/开发模式）。
      # - GET_BINARY_HASH=sha256:abc123...
      # - GET_BINARY_SECRET=abc123def456...

      # ── LLM 脱敏反向代理（可选）──
      # 端口 → 上游 URL 映射。配置后自动替换请求/响应中的凭据为 __VG_CRED_*__ token。
      - LLM_8878=https://api.opencode.ai
      - LLM_8879=https://api.deepseek.com

      # ── PII 脱敏（默认关闭，启用需显式设置）──
      # - PII_REDACTION_ENABLED=1
      # - PII_RESPONSE_SIDE=1
      # - PII_HOLD_MAX=64

      # ── 输出审计（默认关闭，启用需显式设置）──
      # block = 自动拦截危险 tool call；approve = Matrix 人工审批（需 APPROVAL_WHITELIST）
      # - AUDIT_MODE=block
      # - AUDIT_TIMEOUT=90          # 禁止 110-130（上游断连竞态窗口）
      # - AUDIT_HOLD_MAX_BYTES=1048576
      # - AUDIT_POLICY_FILE=/data/audit-policy.yaml
      # - APPROVAL_WHITELIST=@admin:matrix.example.com

      # ── 可选参数 ──
      # - CREDENTIAL_PORT=8877
      # - DATA_DIR=/data
      # - CREDENTIAL_PROXY_DEBUG_DIR=/data/debug  # LLM 对话请求/响应日志
    ports:
      - "127.0.0.1:8877:8877"   # 凭据 API（默认仅回环，外部访问需反代/TLS）
      - "127.0.0.1:8878:8878"   # LLM 代理 — OpenCode（同上）
      - "127.0.0.1:8879:8879"   # LLM 代理 — DeepSeek（同上）
    volumes:
      # 数据目录父卷在前（metrics.sqlite 等），tpm/db 子卷在后（不遮蔽）
      - ${DATA_DIR:-./data}:/data
      # TPM 密封文件（seal.pub + seal.priv；primary key 每次解封现场派生，无需 primary.ctx）
      - ${TPM_HOST_PATH:-./data/tpm}:/data/tpm:ro
      # KeePass 数据库（.kdbx + .key）
      - ${DB_HOST_PATH:-./data/db}:/data/db:ro
    devices:
      - /dev/tpm0:/dev/tpm0
      - /dev/tpmrm0:/dev/tpmrm0
